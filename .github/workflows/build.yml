name: build

on:
  push:
    branches:
    - develop
    - main
    - test
  workflow_dispatch:

jobs:
  build-windows:
    uses: ./.github/workflows/windows.yml

  build-linux:
    uses: ./.github/workflows/linux.yml

  build-android:
    uses: ./.github/workflows/android.yml

  build-freebsd:
    uses: ./.github/workflows/freebsd.yml

  build-osx:
    uses: ./.github/workflows/osx.yml
    permissions:
      actions: write
    secrets: inherit

  build-linux-pkg:
    uses: ./.github/workflows/linux-pkg.yml
    with:
      external_call: true
    needs: [build-linux]
    permissions:
      actions: write

  build-flatpak:
    uses: ./.github/workflows/flatpak.yml
    with:
      external_call: true
    needs: [build-linux]
    permissions:
      actions: write

  repack-qnap:
    uses: ./.github/workflows/qnap-repack.yml
    with:
      external_call: true
    needs: [build-linux]
    permissions:
      actions: write

